; StopWatch BLE Mouse R1 -- source only. No automatic flash.
[platformio]
default_envs = stopwatch_mouse

[env:stopwatch_mouse]
platform = espressif32 @ 6.12.0
board = m5stack-stopwatch
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
build_flags =
    -DBOARD_ID=30
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified @ 0.3.0
    m5stack/M5GFX @ 0.3.0
    m5stack/M5PM1 @ 1.0.7
    m5stack/M5IOE1 @ 1.0.9
    t-vk/ESP32 BLE Mouse @ 0.3.1
lib_ldf_mode = deep+
; VinylM5 uses the native USB-OTG with CDC+MSC at boot.
; Remove the board-level CDC=0 before setting CDC=1.
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=0
